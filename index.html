<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Наш секрет ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1f111c 0%, #0d080c 100%);
      overflow: hidden;
      position: relative;
      color: #f8f9fa;
    }

    /* Контейнер для вопроса */
    .card {
      background: rgba(28, 22, 29, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 77, 136, 0.25);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(255, 46, 108, 0.15);
      text-align: center;
      max-width: 400px;
      width: 90%;
      z-index: 10;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .card.hidden {
      opacity: 0;
      transform: scale(0.8);
      pointer-events: none;
      position: absolute;
    }

    h1 {
      color: #ff4d88;
      font-size: 24px;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(255, 77, 136, 0.3);
    }

    p {
      color: #c2b8c0;
      font-size: 15px;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      background: #140f14;
      color: #ffffff;
      border: 2px solid #4a2538;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      text-align: center;
      margin-bottom: 15px;
    }

    input::placeholder {
      color: #6c5b67;
    }

    input:focus {
      border-color: #ff4d88;
      box-shadow: 0 0 12px rgba(255, 77, 136, 0.25);
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #e62e6b 0%, #b81d52 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.3s, filter 0.3s;
      box-shadow: 0 4px 15px rgba(230, 46, 107, 0.3);
    }

    button:hover {
      filter: brightness(1.1);
      box-shadow: 0 6px 20px rgba(230, 46, 107, 0.5);
    }

    button:active {
      transform: scale(0.98);
    }

    .error-msg {
      color: #ff6b6b;
      font-size: 14px;
      margin-top: 12px;
      min-height: 20px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .error-msg.visible {
      opacity: 1;
    }

    /* Анимация тряски при неверном ответе */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    .shake {
      animation: shake 0.3s ease-in-out;
    }

    /* Финальный экран с любовью */
    .love-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      opacity: 0;
      transform: scale(0.5);
      pointer-events: none;
      transition: opacity 1s ease, transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 10;
    }

    .love-screen.visible {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    /* Большое пульсирующее сердце */
    .big-heart {
      font-size: 110px;
      line-height: 1;
      animation: heartbeat 1.2s infinite;
      filter: drop-shadow(0 0 25px rgba(255, 46, 108, 0.6));
      margin-bottom: 20px;
    }

    @keyframes heartbeat {
      0% { transform: scale(1); }
      15% { transform: scale(1.25); }
      30% { transform: scale(1); }
      45% { transform: scale(1.15); }
      60% { transform: scale(1); }
    }

    .love-text {
      font-size: 42px;
      font-weight: bold;
      color: #ff4d88;
      text-shadow: 0 0 20px rgba(255, 77, 136, 0.6);
    }

    /* Летающие сердечки на фоне */
    .floating-heart {
      position: absolute;
      bottom: -50px;
      font-size: 24px;
      animation: floatUp linear forwards;
      opacity: 0.85;
      z-index: 1;
      user-select: none;
      filter: drop-shadow(0 0 8px rgba(255, 77, 136, 0.4));
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Экран с вопросом -->
  <div class="card" id="questionCard">
    <h1>Маленький секрет ✨</h1>
    <p>Напиши место, где мы впервые встретились:</p>
    <input type="text" id="placeInput" placeholder="Введи ответ..." autocomplete="off">
    <button id="checkBtn">Проверить</button>
    <div class="error-msg" id="errorMsg">Хм, не совсем так. Попробуй вспомнить точнее ❤️</div>
  </div>

  <!-- Экран с признанием -->
  <div class="love-screen" id="loveScreen">
    <div class="big-heart">❤️</div>
    <div class="love-text">иди нахуй с любовью я налысо</div>
  </div>

  <script>
    // ==========================================
    // НАСТРОЙКИ: правильные варианты (маленькими буквами)
    // ==========================================
    const SECRET_PLACES = ["фора", "мехла", "возле форы", "у форы", "на мехалке",];

    const input = document.getElementById('placeInput');
    const btn = document.getElementById('checkBtn');
    const card = document.getElementById('questionCard');
    const errorMsg = document.getElementById('errorMsg');
    const loveScreen = document.getElementById('loveScreen');

    function checkAnswer() {
      const userAnswer = input.value.trim().toLowerCase();

      if (SECRET_PLACES.includes(userAnswer)) {
        errorMsg.classList.remove('visible');
        card.classList.add('hidden');
        
        setTimeout(() => {
          loveScreen.classList.add('visible');
          startHeartsRain();
        }, 400);
      } else {
        errorMsg.classList.add('visible');
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
      }
    }

    btn.addEventListener('click', checkAnswer);
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkAnswer();
    });

    function startHeartsRain() {
      const hearts = ['❤️', '💖', '💕', '💗', '💓'];
      setInterval(() => {
        const heart = document.createElement('div');
        heart.classList.add('floating-heart');
        heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.fontSize = (Math.random() * 20 + 16) + 'px';
        heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
        
        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 6000);
      }, 250);
    }
  </script>
</body>
</html>
